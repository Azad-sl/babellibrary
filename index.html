<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>巴别图书馆</title>
<style>
@font-face{font-family:Kangxi;src:url("Kangxi-subset.woff2") format("woff2");font-display:swap}
*{box-sizing:border-box}
html,body,main{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#d8c8a8;font-family:Kangxi,"Songti SC",SimSun,serif}
body.en{font-family:Georgia,"Times New Roman","Songti SC",SimSun,serif}
main{position:relative}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
main:after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;background:radial-gradient(ellipse,transparent 47%,#02040373)}
header,footer{position:absolute;z-index:1;left:0;right:0;text-align:center;pointer-events:none}
header{top:max(4%,env(safe-area-inset-top))}
small{font-size:11px;color:#ac9878;letter-spacing:.42em;padding-left:.42em}
body.en small{letter-spacing:.3em;padding-left:.3em;font-size:10px}
h1{font-size:38px;font-weight:400;margin:6px 0;letter-spacing:.3em;padding-left:.3em;background:linear-gradient(#ae9570,#eee1bf 38%,#a68c63 70%,#d9c59d);background-clip:text;-webkit-background-clip:text;color:transparent}
body.en h1{letter-spacing:.1em;padding-left:.1em;font-size:clamp(24px,4.4vw,42px)}
.emblem{height:36px;width:36px;vertical-align:-12px;margin-left:12px;filter:drop-shadow(0 0 9px #d8b16e55)}
footer{bottom:4%;font-size:12px;color:#c9b89c99;letter-spacing:.14em}
body.en footer{letter-spacing:.03em}
footer a{pointer-events:auto;color:inherit;text-decoration:none;border-bottom:1px solid #c9b89c44;transition:color .3s}
footer a:hover{color:#ecd9ab}
p{position:absolute;top:43%;width:100%;text-align:center;color:#baa98a;font-size:14px;pointer-events:none}
#tip{position:absolute;z-index:4;pointer-events:none;font-size:13px;letter-spacing:.14em;color:#e6d4a8;background:#0e0a06d9;border:1px solid #62574b;padding:5px 12px;opacity:0;transition:opacity .16s;white-space:nowrap}
body.en #tip{letter-spacing:.05em}
#fade{position:fixed;top:0;right:0;bottom:0;left:0;z-index:7;background:#0a0806;opacity:0;pointer-events:none;transition:opacity .28s ease}
#reader{position:fixed;top:0;right:0;bottom:0;left:0;z-index:8;display:flex;align-items:center;justify-content:center;background:#0b0a08f2;opacity:0;transition:opacity .3s ease}
#reader[hidden]{display:none}
#reader.on{opacity:1}
#book{position:absolute;left:50%;top:50%;width:604px;height:470px;margin:-235px 0 0 -302px;perspective:1600px;user-select:none;-webkit-user-select:none;touch-action:none;
  will-change:transform}
#book .half{position:absolute;top:0;width:300px;height:470px;overflow:hidden;cursor:pointer;background:#15110c}
#book .half.left{left:2px;box-shadow:inset -26px 0 34px -20px #5c43245e,0 26px 54px #000d}
#book .half.right{right:2px;box-shadow:inset 26px 0 34px -20px #5c43245e,0 26px 54px #000d}
#book .slotface{position:absolute;top:0;right:0;bottom:0;left:0}
#book .pg{position:absolute;top:0;right:0;bottom:0;left:0;background:#e7d9b4;padding:20px 18px 34px}
#book .pt{height:100%;overflow:hidden;font:12px/1.88 Georgia,"Times New Roman",serif;color:#33291c;letter-spacing:.3px;white-space:pre-wrap;word-break:break-all}
#book .pn{position:absolute;left:0;right:0;bottom:11px;text-align:center;font:11px Georgia,serif;color:#6b5638;letter-spacing:.2em;opacity:.85}
#book .pg.tp,#book .pg.colo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#e7d9b4;text-align:center}
#book .tp .hexs,#book .colo .hexs{width:58px;height:58px;opacity:.85}
#book .tp .ttl{font:600 19px Georgia,serif;color:#2c2317;letter-spacing:.08em;max-width:82%;word-break:break-all;line-height:1.5}
#book .tp .sub{font:10px Georgia,serif;letter-spacing:.42em;color:#7a6647}
#book .tp .rule,#book .colo .rule{width:110px;height:1px;background:#a08a5e66;margin:2px 0}
#book .tp .idx,#book .colo .idx{font:11px Georgia,"Songti SC",serif;color:#6b5638;letter-spacing:.14em;line-height:1.9}
#book .colo .big{font:13px Georgia,serif;color:#4a3a24;letter-spacing:.3em}
#book canvas.cvr{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block}
#book .edge{position:absolute;top:8px;bottom:8px;width:5px;opacity:.4;pointer-events:none;
  background:repeating-linear-gradient(to right,#cbb98f 0 1px,#a08c64 1px 2px);border-radius:1px}
#book .edge.eL{left:-4px}#book .edge.eR{right:-4px}
#book .gutter{position:absolute;left:calc(50% - 16px);top:0;width:32px;height:100%;pointer-events:none;
  background:linear-gradient(90deg,#3a2a1800,#3a2a1826 30%,#261a0e5e 50%,#3a2a1826 70%,#3a2a1800)}
#lshadow{position:absolute;top:0;bottom:0;left:calc(50% - 95px);width:190px;opacity:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.5) 0%,rgba(0,0,0,.2) 42%,transparent 72%)}
#book .leaf{position:absolute;top:0;left:302px;width:300px;height:470px;transform-style:preserve-3d;
  transform-origin:0% 50%;display:none;will-change:transform;z-index:3;pointer-events:none}
#book .leaf .face{position:absolute;top:0;right:0;bottom:0;left:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
#book .leaf .face.b{transform:rotateY(180deg)}
#about{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9;display:flex;align-items:center;justify-content:center;background:#000000a8;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .28s ease}
#about[hidden]{display:none}
#about.on{opacity:1}
#about article{position:relative;max-width:460px;width:calc(100vw - 40px);max-height:82vh;overflow:auto;background:#101613f5;border:1px solid #625741;box-shadow:0 14px 70px #000d;padding:30px 34px 26px;transform:translateY(12px) scale(.985);transition:transform .28s ease}
#about.on article{transform:none}
#about h2{font-size:19px;font-weight:400;color:#e6d3a8;letter-spacing:.4em;margin:0 0 16px;text-align:center}
body.en #about h2{letter-spacing:.12em}
#about h2 .emblem{height:30px;width:30px;vertical-align:-9px;margin-left:10px}
#about article p{position:static;font-size:13px;line-height:2.05;color:#c6b598;margin:0 0 12px;text-align:justify;pointer-events:auto}
#about .epigraph{color:#d9c79e;text-align:center;line-height:1.9;margin-bottom:14px}
#about .epigraph span{display:block;font-size:11px;color:#8f826b;margin-top:4px}
#about .count{color:#9a8c72;text-align:center;font-size:12px}
#about .who{display:block;text-align:center;margin:16px 0 6px;font-size:13px;color:#b7a684}
#about .who a{color:#d8bd8b;text-decoration:none;border-bottom:1px solid #d8bd8b55;padding-bottom:1px;pointer-events:auto}
#about .who a:hover{color:#f0d9a6}
#about .close{display:block;margin:14px auto 0;background:none;border:1px solid #625741;color:#c9b48b;font:inherit;font-size:13px;letter-spacing:.3em;text-indent:.3em;padding:9px 26px;cursor:pointer;transition:border-color .3s,color .3s}
#about .close:hover{border-color:#c9a25e;color:#ecd9ab}
@media(max-width:600px){h1{font-size:30px}body.en h1{font-size:22px}.emblem{height:28px;width:28px;vertical-align:-9px;margin-left:8px}footer{font-size:10px}#about article{padding:24px 20px 20px}#about article p{font-size:12px}}
</style>

<main>
<canvas aria-label="The Library of Babel"></canvas>
<header><small>六 角 回 廊</small><h1>巴 别 图 书 馆</h1><svg class="emblem" viewBox="0 0 40 40" aria-hidden="true"><polygon points="33.9,12 33.9,28 20,36 6.1,28 6.1,12 20,4" fill="none" stroke="#bd9a5e" stroke-width="1.6"/><polygon points="28.7,15 28.7,25 20,30 11.3,25 11.3,15 20,10" fill="none" stroke="#8f7a52" stroke-width="1"/><circle cx="20" cy="20" r="1.8" fill="#d8b16e"/></svg></header>
<footer>拖拽环视 · 滚轮推拉 · 点击取卷 · <a href="#" id="langBtn">EN</a> · <a href="#" id="about-link">馆志</a></footer>

<span id="tip"></span>

<div id="fade"></div>

<div id="reader" hidden>
  <div id="book">

<!-- 独立哨兵脚本 -->
<script>
function reportError(t2){const m=document.getElementById("status");if(m&&m.hidden!==true)m.textContent="载入异常 / Load error: "+t2+"（请刷新 / please refresh）"}
addEventListener("error",ev=>reportError((ev&&ev.message)||"unknown"));
addEventListener("unhandledrejection",ev=>reportError((ev&&ev.reason&&ev.reason.message)||"unknown"));
</script>
<!-- 语言与引导脚本 -->
<script>
const I18N={
zh:{title:"巴别图书馆",hex:"六 角 回 廊",h1:"巴 别 图 书 馆",footer:"拖拽环视 · 滚轮推拉 · 点击取卷",about:"馆志",opening:"正在进入图书馆…",
 wd:"图书馆久未开启 · 请检查网络后刷新重试",fail3d:"未能开启三维场景",ctx:"图形设备已暂停，请刷新。",take:"取卷",blog:"博客",
 abTitle:"巴 别 馆 志",epi:"「宇宙（别人管它叫图书馆）。」",epiBy:"—— 博尔赫斯《巴别图书馆》",
 ab1:"此馆致敬博尔赫斯《巴别图书馆》：六角回廊环环相嵌，书架与半空的浮动书，皆由二十几个字母与逗、句、空格随机拼合而成。书脊上那些题名并非书名，只是字母的偶然；绝大多数书是无可解读的天书。你现在看到的每一册，都刚刚被随意地“写”了出来。",
 ab2:"取下任何一卷，先见封面；点按右半向左翻、左半向右翻，亦可按住页边拖拽翻页，直至封底。若某页忽然读出了意义，请理解为巧合：在一座收藏一切可能的图书馆里，荒诞与真理同属馆藏，谬误与奇迹皆为序章。",
 keeper:"图书馆管理员 · ",close:"合 卷",readN:"至此，您已在此馆翻阅过 {n} 页。"},
en:{title:"The Library of Babel",hex:"THE HEXAGONAL GALLERIES",h1:"The Library of Babel",footer:"Drag to look around · Scroll to approach · Click to take a volume",about:"About",opening:"Entering the Library…",
 wd:"The Library is slow to open · check your connection and refresh",fail3d:"Could not start the 3-D scene",ctx:"The graphics device was paused — please refresh.",take:"take",blog:"Blog",
 abTitle:"About this Library",epi:"“The universe (which others call the Library)…”",epiBy:"— Jorge Luis Borges, “The Library of Babel”",
 ab1:"This Library is a homage to Borges' “The Library of Babel”: hexagonal galleries nested without end. The books on the shelves and floating in mid-air are composed at random from two dozen letters, commas, periods, and spaces. The marks on the spines are not titles, only accidents of letters; most volumes are indecipherable gibberish. Every book you see has just been casually “written” into existence, right now.",
 ab2:"Take down any volume to see its cover. Tap the right half to turn forward, the left half to turn back, or drag a page edge to flip—just like reading a physical book—until the very end. If a page suddenly makes sense, take it as coincidence: in a Library that holds all possibilities, absurdity and truth belong alike to the collection. Error and miracle are both prologues.",
 keeper:"Librarian · ",close:"CLOSE",readN:"So far you have turned {n} pages in this Library."}};
const EMBLEM='<svg class="emblem" viewBox="0 0 40 40" aria-hidden="true"><polygon points="33.9,12 33.9,28 20,36 6.1,28 6.1,12 20,4" fill="none" stroke="#bd9a5e" stroke-width="1.6"/><polygon points="28.7,15 28.7,25 20,30 11.3,25 11.3,15 20,10" fill="none" stroke="#8f7a52" stroke-width="1"/><circle cx="20" cy="20" r="1.8" fill="#d8b16e"/></svg>';
function t(k){const L=window.__lang||"zh";return (I18N[L]&&I18N[L][k])||I18N.zh[k]||k}
function readCount(){try{return +(localStorage.getItem("babel_pages")||0)}catch(_){return 0}}
function buildAbout(){
  const ab=document.getElementById("about");if(!ab)return;
  const n=readCount();
  ab.querySelector("article").innerHTML=
   `<h2>${t("abTitle")}${EMBLEM}</h2>`+
   `<p class="epigraph">${t("epi")}<span>${t("epiBy")}</span></p>`+
   `<p>${t("ab1")}</p><p>${t("ab2")}</p>`+
   `<p class="count">${n>0?t("readN").replace("{n}",n):""}</p>`+
   `<span class="who">${t("keeper")}<a href="https://home.azad.asia/" target="_blank" rel="noopener">Azad</a> · <a href="https://babel.azad.asia/" target="_blank" rel="noopener">${t("blog")}</a></span>`+
   `<button class="close" type="button">${t("close")}</button>`;
}
function openAbout(){buildAbout();const ab=document.getElementById("about");ab.hidden=false;requestAnimationFrame(()=>requestAnimationFrame(()=>ab.classList.add("on")))}
function closeAbout(){const ab=document.getElementById("about");ab.classList.remove("on");setTimeout(()=>{ab.hidden=true},300)}
function applyLang(l){
  window.__lang=l;
  try{localStorage.setItem("babel_lang",l)}catch(_){}
  document.documentElement.lang=l==="zh"?"zh-CN":"en";
  document.body.classList.toggle("en",l==="en");
  document.title=t("title");
  const sm=document.querySelector("header small");if(sm)sm.textContent=t("hex");
  const h1=document.querySelector("h1");if(h1)h1.textContent=t("h1");
  const ft=document.querySelector("footer");
  if(ft)ft.innerHTML=`${t("footer")} · <a href="#" id="langBtn">${l==="zh"?"EN":"中文"}</a> · <a href="#" id="about-link">${t("about")}</a>`;
  const st=document.getElementById("status");
  if(st&&!st.hidden)st.textContent=t("opening");
  buildAbout();
  if(window.__onLang)window.__onLang();
}
/* 默认语言：localStorage > IP 判定 > 浏览器语言 */
(function(){
  let l=null;try{l=localStorage.getItem("babel_lang")}catch(_){}
  if(l!=="zh"&&l!=="en"){
    l=/^en/i.test(navigator.language||"")?"en":"zh";
    (async()=>{
      try{
        const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),1800);
        const r=await fetch("https://ipwho.is/",{signal:ac.signal});clearTimeout(tm);
        const j=await r.json(),cc=j&&j.country_code;
        if(!cc)return;
        const zhAreas=["CN","TW","HK","MO","SG","MY"];
        const ip=zhAreas.includes(cc)?"zh":"en";
        if(ip!==window.__lang)applyLang(ip);
      }catch(_){}
    })();
  }
  window.__lang=l;
  applyLang(l);
})();
const msg=document.querySelector("#status");
function fail(text){if(msg){msg.hidden=false;msg.textContent=text}}
const watchdog=setTimeout(()=>fail(t("wd")),15000);
document.addEventListener("click",e=>{
  if(e.target.closest("#langBtn")){e.preventDefault();applyLang(window.__lang==="zh"?"en":"zh");return}
  if(e.target.closest("#about-link")){e.preventDefault();openAbout();return}
  const ab=e.target.closest("#about");
  if(ab&&!ab.hidden&&(e.target===ab||e.target.closest(".close")))closeAbout();
});
document.addEventListener("keydown",e=>{
  const ab=document.getElementById("about");
  if(e.key==="Escape"&&ab&&!ab.hidden)closeAbout();
});
</script>
<script type="module">
const mobile=matchMedia("(pointer:coarse)").matches,quiet=matchMedia("(prefers-reduced-motion:reduce)").matches;
try{const [T,{OrbitControls}]=await Promise.all([import("three"),import("three/addons/controls/OrbitControls.js")]);await run(T,OrbitControls)}
catch(e){clearTimeout(watchdog);console.error("boot failed",e);fail(t("fail3d")+" · "+((e&&e.message)||"")+" · "+(window.__lang==="en"?"please refresh":"請刷新重試"))}
async function run(T,OrbitControls){
const canvas=document.querySelector("canvas"),r=new T.WebGLRenderer({canvas,antialias:true}),scene=new T.Scene(),cam=new T.PerspectiveCamera(57,1,.1,90),ctl=new OrbitControls(cam,canvas);
r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.12;scene.background=new T.Color(0x050506);scene.fog=new T.FogExp2(0x0a0d10,.042);cam.position.set(0,-.3,-.8);ctl.target.set(0,-.05,0);
ctl.enableZoom=true;ctl.zoomSpeed=.55;ctl.minDistance=.12;ctl.maxDistance=5.4;
ctl.enablePan=false;ctl.enableDamping=true;ctl.rotateSpeed=.52;ctl.minPolarAngle=.55;ctl.maxPolarAngle=2.5;ctl.update();
ctl.autoRotate=!quiet;ctl.autoRotateSpeed=.35;
const stopAuto=()=>ctl.autoRotate=false;
canvas.addEventListener("pointerdown",stopAuto,{once:true});
canvas.addEventListener("wheel",stopAuto,{once:true});
let post=null,dof=null,aa=null;
const V=(x=0,y=0,z=0)=>new T.Vector3(x,y,z),std=o=>new T.MeshStandardMaterial(o),tau=Math.PI*2;
let seed=(Date.now()^(Math.random()*0xFFFFFFFF))>>>0;
const rnd=()=>((seed=Math.imul(seed,1664525)+1013904223>>>0)/4294967296);
const makeRng=s=>{let x=(s>>>0)||1;return()=>{x=Math.imul(x,1664525)+1013904223>>>0;return x/4294967296}};
const LETTERS="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const gib=(rg,min,max)=>{const len=min+((rg()*(max-min+1))|0);let s="",w=0;for(let i=0;i<len;i++){s+=LETTERS[(rg()*26)|0];if(++w>=2+(rg()*4|0)&&i<len-1){s+=" ";w=0}}return s};
function surface(w,h,fn){const c=document.createElement("canvas");c.width=w;c.height=h;fn(c.getContext("2d"),w,h);return c}
function texture(c){const t2=new T.CanvasTexture(c);t2.colorSpace=T.SRGBColorSpace;t2.anisotropy=Math.min(mobile?4:16,r.capabilities.getMaxAnisotropy());return t2}
function line(g,x,y,X,Y,col,n=1){g.strokeStyle=col;g.lineWidth=n;g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.stroke()}

/* ---- 光 ---- */
scene.add(new T.HemisphereLight(0xd8d4c8,0x7c8896,.9),new T.AmbientLight(0xb8bfca,.26));
const key=new T.DirectionalLight(0xffd9a8,1.0);key.position.set(-5,9,4);scene.add(key);
{const hr=new Date().getHours(),night=hr>=22||hr<5,twi=(hr>=5&&hr<8)||(hr>=17&&hr<21);
 key.color.set(night?0xffc387:twi?0xffd9a8:0xffdcae);key.intensity*=night?.88:twi?1:.94;scene.fog.color.set(night?0x090c0f:0x0a0d10)}
r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;key.castShadow=true;key.shadow.mapSize.setScalar(mobile?512:1024);Object.assign(key.shadow.camera,{left:-15,right:15,top:15,bottom:-15,far:40});key.shadow.camera.updateProjectionMatrix();key.shadow.normalBias=.025;
const wash=new T.PointLight(0xffdfb4,10,15,2);wash.position.set(0,1.4,.6);scene.add(wash);

/* ---- 悬灯 ---- */
const glowTex=texture(surface(128,128,g=>{const d=g.createRadialGradient(64,64,0,64,64,64);d.addColorStop(0,"rgba(255,238,205,1)");d.addColorStop(.25,"rgba(255,214,150,.7)");d.addColorStop(1,"rgba(255,190,110,0)");g.fillStyle=d;g.fillRect(0,0,128,128)}));
const lamps=[];
function hangLamp(x,y,z,rad,int,dist,glowS){
 const top=5.85,g=new T.Group();g.position.set(x,top,z);
 const Lc=top-y;
 const cord=new T.Mesh(new T.CylinderGeometry(.008,.008,Lc,6),std({color:0x1a140c,roughness:1}));
 cord.position.y=-Lc/2;g.add(cord);
 const shade=new T.Mesh(new T.CylinderGeometry(rad*1.1,rad*3.4,rad*2.6,18,1,true),std({color:0x241a0e,roughness:.5,metalness:.55,side:T.DoubleSide}));
 shade.position.y=-Lc+rad*1.9;g.add(shade);
 const ring=new T.Mesh(new T.TorusGeometry(rad*1.2,rad*.18,8,20),std({color:0x3a2a18,roughness:.4,metalness:.6}));
 ring.rotation.x=Math.PI/2;ring.position.y=-Lc+rad*3.2;g.add(ring);
 const bulb=new T.Mesh(new T.SphereGeometry(rad*.8,16,12),std({color:0x3a2a14,emissive:0xffc98a,emissiveIntensity:1.7,roughness:.4}));
 bulb.position.y=-Lc;g.add(bulb);
 const glow=new T.Sprite(new T.SpriteMaterial({map:glowTex,color:0xffd9a6,transparent:true,opacity:.4,blending:T.AdditiveBlending,depthWrite:false}));
 glow.scale.set(glowS,glowS*.75,1);glow.position.y=-Lc;g.add(glow);
 const pl=new T.PointLight(0xffd0a0,int,dist,2);pl.position.y=-Lc;g.add(pl);
 scene.add(g);lamps.push({g,pl,base:int,ph:rnd()*tau,bulb:V(x,y,z)});

 * 新样式：近黑暖灰的古石砖体、砖缝沉入阴影，移除发光铜缝与黄铜刻环，
 * 保留高度场凹凸与磨损噪声；灯光落处只余极轻的暖意，贴合无限幽暗的回廊意象 */
const floorMat=std({color:0xffffff,roughness:.97});
floorMat.onBeforeCompile=shader=>{
  shader.vertexShader=shader.vertexShader
    .replace('#include <common>','#include <common>\nvarying vec2 stonePos;\nvarying vec3 vWp;')
    .replace('#include <begin_vertex>','#include <begin_vertex>\nstonePos = position.xy;\nvWp = (modelMatrix*vec4(position,1.)).xyz;');
  shader.fragmentShader=shader.fragmentShader
    .replace('#include <common>',`
    #include <common>
    varying vec2 stonePos;
    varying vec3 vWp;
    float hash21(vec2 q){q=fract(q*vec2(127.1,311.7));q+=dot(q,q+34.23);return fract(q.x*q.y);}
    float vnoise(vec2 q){
      vec2 i=floor(q),f=fract(q);f=f*f*(3.-2.*f);
      float a=hash21(i),b=hash21(i+vec2(1.,0.)),c=hash21(i+vec2(0.,1.)),d=hash21(i+vec2(1.,1.));
      return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
    }
    float hexH(vec2 p){
      vec2 uvp=p/0.68;
      vec2 hr2=vec2(3.0,1.7320508);
      vec2 hh2=vec2(1.5,0.8660254);
      vec2 qa=mod(uvp,hr2)-hh2;
      vec2 qb=mod(uvp-hh2,hr2)-hh2;
      vec2 gv2=dot(qa,qa)<dot(qb,qb)?qa:qb;
      vec2 cid2=uvp-gv2;
      float E2=max(max(abs(gv2.y),abs(.8660254*gv2.x+.5*gv2.y)),abs(.8660254*gv2.x-.5*gv2.y));
      float dE2=E2/.80;
      float h=(1.-smoothstep(.30,1.,dE2))*.030;
      h+=(hash21(cid2)-.5)*.016;
      h+=vnoise(p*2.3)*.010;
      ${mobile?'':'h+=vnoise(p*7.7)*.0045;'}
      h+=vnoise(p*.4+31.7)*.02;
      return h;
    }`)
    .replace('#include <color_fragment>',`
    #include <color_fragment>
    vec2 p=stonePos;
    float fE;float fhn;vec2 fp;
    vec2 uvp=p/0.68;
    vec2 hr=vec2(3.0,1.7320508);
    vec2 hh=vec2(1.5,0.8660254);
    vec2 ha=mod(uvp,hr)-hh;
    vec2 hb=mod(uvp-hh,hr)-hh;
    vec2 gv=dot(ha,ha)<dot(hb,hb)?ha:hb;
    vec2 cid=uvp-gv;
    float E=max(max(abs(gv.y),abs(.8660254*gv.x+.5*gv.y)),abs(.8660254*gv.x-.5*gv.y));
    float aaE=fwidth(E);
    float lw=.015+aaE*1.4;
    float edge=1.-smoothstep(.80-lw,.80,E);
    float hn=hash21(cid);
    float dE=E/.80;
    /* 古石砖体：近黑暖灰双色阶，边缘沉入暗影 */
    vec3 tile=mix(vec3(.034,.033,.037),vec3(.060,.057,.060),hn);
    tile*=1.-.22*smoothstep(.30,1.0,dE);
    float fade=1.-smoothstep(8.,18.,distance(vWp,cameraPosition));
    float mo=vnoise(p*1.35+hn*23.17);
    tile*=mix(1.,.92+.13*mo,fade);
    tile*=.96+.06*vnoise(p*.5+7.);
    vec3 base=mix(vec3(.002,.002,.003),tile,edge);
    diffuseColor.rgb=base;
    fE=dE;fhn=hn;fp=p;`)
    .replace('#include <roughnessmap_fragment>',`
    float roughnessFactor=clamp(roughness*(0.88+0.16*vnoise(fp*1.1+3.1))+0.08*smoothstep(.90,1.12,fE)+0.04*fhn,0.55,1.0);`)
    .replace('#include <normal_fragment_maps>',`
    #include <normal_fragment_maps>
    {
      float be=0.02;
      float h0=hexH(fp);
      float hX=hexH(fp+vec2(be,0.0));
      float hZ=hexH(fp+vec2(0.0,-be));
      vec3 wN=normalize(vec3((h0-hX)/be*1.8,1.0,(h0-hZ)/be*1.8));
      normal=normalize(mat3(viewMatrix)*wN);
    }`);
};

const glyphU={px:200.0};
let glyphPts=null,glyphPos=null,glyphMeta=[];
{
  const AC=64,atlasC=surface(AC*26,AC,g=>{
    g.textAlign="center";g.textBaseline="middle";
    for(let i=0;i<26;i++){
      g.fillStyle="#fff";g.font='46px Georgia,serif';
      g.fillText(LETTERS[i],i*AC+AC/2,AC/2+2);

  atlas.generateMipmaps=false;atlas.minFilter=T.LinearFilter;

  for(let i=order.length-1;i>0;i--){const j=(rnd()*(i+1))|0;[order[i],order[j]]=[order[j],order[i]]}
  const N=26;
  glyphPos=new Float32Array(N*3);
  const aL=new Float32Array(N);
  for(let i=0;i<N;i++){
    aL[i]=i;

    glyphPos[i*3]=r*Math.sin(an);
    glyphPos[i*3+1]=rnd()*9.4-3.7;
    glyphPos[i*3+2]=r*Math.cos(an);
    glyphMeta.push({r,an,w:(.045+rnd()*.13)*(rnd()<.5?-1:1),y0:glyphPos[i*3+1],
      f:.12+rnd()*.22,p:rnd()*tau,amp:.14+rnd()*.24});
  }
  const g2=new T.BufferGeometry();
  g2.setAttribute("position",new T.BufferAttribute(glyphPos,3));

    transparent:true,depthWrite:false,blending:T.AdditiveBlending,
    uniforms:{map:{value:atlas},uPx:{value:glyphU.px},uCol:{value:new T.Color(1.22,1.02,.62)},uOp:{value:mobile?.38:.5}},
    vertexShader:`attribute float aLetter;varying float vL;uniform float uPx;

      gl_PointSize=clamp(uPx/-mv.z,4.0,90.0);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform sampler2D map;uniform vec3 uCol;uniform float uOp;varying float vL;

}
const noiseT=texture(surface(256,256,(g,w,h)=>{let im=g.createImageData(w,h);for(let i=0;i<w*h;i++){const v=rnd()*255;im.data.set([v,v,v,255],4*i)}g.putImageData(im,0,0)}));

function mistLayer(off,scale,spd,boost){
  return new T.ShaderMaterial({transparent:true,depthWrite:false,side:T.DoubleSide,
    defines:{OCT:mobile?3:4},
    uniforms:{noiseMap:{value:noiseT},clock:{value:0},off:{value:new T.Vector2(off[0],off[1])},uscale:{value:scale},spd:{value:spd},boost:{value:boost}},
    vertexShader:`varying vec2 vUv;varying vec3 wp;
      void main(){vUv=uv;vec4 w=modelMatrix*vec4(position,1.);wp=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
    fragmentShader:`
      uniform sampler2D noiseMap;uniform float clock,uscale,spd,boost;uniform vec2 off;
      varying vec2 vUv;varying vec3 wp;
      float n(vec2 q){
        vec2 i=floor(q),f=fract(q);f=f*f*(3.-2.*f);
        float a=texture2D(noiseMap,(i+.5)/256.).r;
        float b=texture2D(noiseMap,(i+vec2(1.,0.)+.5)/256.).r;
        float c=texture2D(noiseMap,(i+vec2(0.,1.)+.5)/256.).r;
        float d=texture2D(noiseMap,(i+vec2(1.,1.)+.5)/256.).r;
        return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
      }
      float fbm(vec2 q){float s=0.,amp=.5;for(int k=0;k<OCT;k++){s+=amp*n(q);q=q*2.03+vec2(17.3,9.1);amp*=.5;}return s;}
      void main(){
        float t=clock*spd;
        vec2 q=wp.xz*uscale+off;
        float w1=fbm(q*.5+vec2(t*.045,-t*.02));
        vec2 flow=vec2(t*.05,t*.022)+vec2(w1,-w1)*.9;
        float f=fbm(q*.42+flow);
        float ptch=fbm(q*.11-vec2(t*.02,t*.01));
        float body=smoothstep(.48,.86,f*.58+ptch*.42);
        float rad=length(wp.xz);
        float ring=smoothstep(1.1,3.0,rad)*(1.-smoothstep(8.5,15.5,rad));
        float edge=1.-smoothstep(.30,.48,max(abs(vUv.x-.5),abs(vUv.y-.5)));
        float far=1.-smoothstep(9.,20.,distance(wp,cameraPosition));
        float alpha=body*ring*edge*far*boost;
        vec3 col=mix(vec3(.35,.40,.39),vec3(.57,.62,.59),body);
        gl_FragColor=vec4(col,alpha);
      }`});
}

function animShift(target){

  const from=shiftNow,d=target-from;

function size(){const w=canvas.clientWidth,h=canvas.clientHeight,p=Math.min(devicePixelRatio,mobile?1.75:2.25,Math.sqrt((mobile?2400000:3200000)/(w*h)));r.setPixelRatio(p);r.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?65:57;cam.updateProjectionMatrix();glyphU.px=h*p*.32;if(post){post.setPixelRatio(p);post.setSize(w,h);aa.uniforms.resolution.value.set(1/post.readBuffer.width,1/post.readBuffer.height);dof.uniforms.aspect.value=w/h}}size();addEventListener("resize",size);
function frame(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;time+=dt*(quiet?.2:1);if(!flight)ctl.update();cam.updateMatrixWorld();

  flight.updateMatrixWorld();

    flight.userData.sent=true;

const hot=(mouse&&!flight)?pick():null,kk=1-Math.exp(-dt*10);
for(const m of books){if(m===flight)continue;
 let lampF=0;
 for(const l of lamps){const dy=m.position.y-l.bulb.y;if(dy<-.15&&dy>-6.5){const dh=Math.hypot(m.position.x-l.bulb.x,m.position.z-l.bulb.z);if(dh<1.6){const f=(1-dh/1.6)*(1+dy/6.5);if(f>lampF)lampF=f}}}

 t2=Math.max(t2,lampF*.45);

if(hot&&!flight){tipEl.textContent=`«${hot.userData.title}» · ${t("take")}`;const tw=tipEl.offsetWidth||120;tipEl.style.left=Math.max(8,Math.min(innerWidth-tw-16,px+16))+"px";tipEl.style.top=Math.max(8,Math.min(innerHeight-44,py+18))+"px";tipEl.style.opacity=1}else tipEl.style.opacity=0;
canvas.style.cursor=flight?"default":held.size?"grabbing":hot?"pointer":"grab";
dust.rotation.y=time*.012;dust.position.y=.19*Math.sin(time*.27);
if(glyphPts){const gp=glyphPts.geometry.attributes.position;
 for(let i=0;i<26;i++){const q=glyphMeta[i];
  gp.array[i*3]=q.r*Math.sin(q.an+time*q.w);
  gp.array[i*3+1]=q.y0+q.amp*Math.sin(time*q.f+q.p);
  gp.array[i*3+2]=q.r*Math.cos(q.an+time*q.w);}
 gp.needsUpdate=true}
for(const l of lamps){l.g.rotation.z=Math.sin(time*.5+l.ph)*.02;l.g.rotation.x=Math.cos(time*.42+l.ph)*.02;l.pl.intensity=l.base*(1+.04*Math.sin(time*2.7+l.ph))}
for(const mm of mists)mm.uniforms.clock.value=time;
if(post){let focus=hot||flight;if(!focus){let best=Infinity;for(const m of books){tmp.copy(m.position).project(cam);const d=(tmp.x*cam.aspect)**2+tmp.y**2;if(tmp.z<1&&tmp.z>-1&&d<best){focus=m;best=d}}}if(focus)dof.uniforms.focus.value=T.MathUtils.lerp(dof.uniforms.focus.value,-tmp.copy(focus.position).applyMatrix4(cam.matrixWorldInverse).z,kk);post.render(dt)}else r.render(scene,cam)}
frame(last);r.setAnimationLoop(frame);clearTimeout(watchdog);msg.hidden=true;
